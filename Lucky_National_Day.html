<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卷子抽奖 · 昔涟</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    color:#3E2A34;
    background:
      radial-gradient(900px 520px at 10% -10%, #FFE6F0 0%, rgba(255,230,240,0) 60%),
      radial-gradient(720px 460px at 98% 6%, #FFEFF5 0%, rgba(255,239,245,0) 58%),
      radial-gradient(760px 520px at 50% 120%, #FBD3E0 0%, rgba(251,211,224,0) 62%),
      #FFF5F8;
    min-height:100%;
    padding:40px 20px 64px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 背景涟漪装饰 ---------- */
  .ripple{
    position:fixed; right:-130px; top:-130px; width:420px; height:420px;
    border-radius:50%; pointer-events:none; z-index:0;
    border:1.5px solid rgba(244,155,184,.35);
    box-shadow:0 0 0 42px rgba(244,155,184,.10), 0 0 0 96px rgba(244,155,184,.06);
  }
  .ripple.b{
    right:auto; left:-170px; top:auto; bottom:-190px; width:380px; height:380px;
    border-color:rgba(251,211,224,.55);
    box-shadow:0 0 0 48px rgba(251,211,224,.20), 0 0 0 104px rgba(251,211,224,.10);
  }

  .app{ position:relative; z-index:1; width:min(980px,100%); margin:0 auto; }

  /* ---------- 头部 ---------- */
  .hero{ text-align:center; margin-bottom:24px; }
  .hero h1{
    margin:0 0 10px; font-size:34px; letter-spacing:1px; color:#A63A6B;
  }
  .hero h1::after{
    content:"♪"; margin-left:6px; color:#F49BB8; font-weight:400;
  }
  .hero p{ margin:0; color:#9A8090; font-size:14.5px; }
  .hero .credit{
    margin:10px 0 0; font-size:12.5px; color:#C9A6B6;
    letter-spacing:.8px; font-weight:500;
  }

  /* ---------- 面板 ---------- */
  .panel{
    background:#fff;
    border:1px solid #FDEBF1;
    border-radius:22px;
    box-shadow:0 18px 40px -24px rgba(166,58,107,.5);
    padding:26px 28px;
  }
  .grid{
    display:grid; grid-template-columns:1.05fr .95fr; gap:20px; margin-bottom:20px;
  }
  @media (max-width:780px){
    .grid{ grid-template-columns:1fr; }
  }

  /* ---------- 计数器 ---------- */
  .tag{
    display:inline-block; font-size:12.5px; letter-spacing:1.5px;
    color:#D96BA0; background:#FFF1F6; border:1px solid #FBD3E0;
    padding:4px 12px; border-radius:99px;
  }
  .number{
    display:flex; align-items:baseline; gap:8px; margin-top:16px;
    font-size:88px; font-weight:800; line-height:1; letter-spacing:-2px;
    color:#A63A6B; font-variant-numeric:tabular-nums;
  }
  .number i{ font-style:normal; font-size:19px; font-weight:600; color:#B99CAB; letter-spacing:0; }
  .number span{ display:inline-block; }
  .icons{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; min-height:44px; align-items:flex-end;
  }
  .icon{ width:32px; height:38px; display:block; }
  .more{
    align-self:center; font-size:14px; font-weight:700; color:#D96BA0;
    background:#FFF1F6; border:1px solid #FBD3E0; border-radius:99px; padding:3px 10px;
  }
  .hint{ display:none; margin:14px 0 0; font-size:13.5px; color:#C3A7B6; }

  /* ---------- 抽取区 ---------- */
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .round{ font-size:14.5px; color:#9A8090; letter-spacing:.5px; }
  .round b{ font-size:17px; color:#A63A6B; }
  .dots{ display:flex; gap:7px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:#FBD3E0; transition:all .28s; }
  .dot.on{ background:#D96BA0; transform:scale(1.18); box-shadow:0 0 0 4px rgba(217,107,160,.15); }

  .slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0 4px; }
  .slot{
    height:78px; border-radius:16px; position:relative;
    display:grid; place-items:center;
    background:#FFF9FB; border:1.5px dashed #FBD3E0;
    font-size:27px; font-weight:800; color:#E2C9D4;
    transition:all .25s;
  }
  .slot em{ font-style:normal; }
  .slot.minus{
    background:linear-gradient(160deg,#FFF0F6,#FBD3E0);
    border:1.5px solid #F49BB8; color:#B03A6E;
  }
  .slot.plus{
    background:linear-gradient(160deg,#FFFAEF,#FCE6C3);
    border:1.5px solid #EBC98A; color:#B5822F;
  }
  .cap{
    position:absolute; bottom:8px; right:10px;
    font-size:10.5px; font-weight:600; letter-spacing:.5px;
    color:#C08FA8; background:rgba(255,255,255,.75);
    border-radius:99px; padding:1px 7px;
  }

  .btn{
    width:100%; margin-top:20px; padding:16px;
    border:0; border-radius:16px; cursor:pointer;
    font-family:inherit; font-size:19px; font-weight:700; letter-spacing:3px;
    color:#fff;
    background:linear-gradient(135deg,#E07BAE 0%,#A63A6B 100%);
    box-shadow:0 14px 26px -14px rgba(166,58,107,.9);
    transition:transform .16s, box-shadow .16s, filter .16s;
  }
  .btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 18px 30px -14px rgba(166,58,107,.9); }
  .btn:active:not(:disabled){ transform:translateY(1px) scale(.995); }
  .btn:disabled{ filter:grayscale(.4) opacity(.55); cursor:default; }

  .odds{ margin:14px 0 0; text-align:center; font-size:13px; color:#A992A0; }
  .odds b{ font-weight:700; }
  .odds .minus{ color:#C0407A; }
  .odds .plus{ color:#B5822F; }

  /* ---------- 统计 ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
    margin-bottom:20px; padding:22px 28px;
  }
  .stat{ text-align:center; }
  .stat b{
    display:block; font-size:30px; font-weight:800; color:#A63A6B;
    line-height:1.2; font-variant-numeric:tabular-nums;
  }
  .stat span{ font-size:12.5px; color:#A992A0; letter-spacing:.5px; }

  /* ---------- 记录 ---------- */
  .history{ margin-bottom:20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .panel-head .title{ font-size:15px; font-weight:700; color:#A63A6B; letter-spacing:.5px; }
  .ghost{
    border:1px solid #FBD3E0; background:#FFF7FA; color:#C58AA9;
    font-family:inherit; font-size:12.5px; padding:5px 13px; border-radius:99px;
    cursor:pointer; transition:.18s;
  }
  .ghost:hover{ background:#FFEBF3; color:#A63A6B; }

  #logList{ list-style:none; margin:0; padding:0; max-height:236px; overflow-y:auto; }
  #logList li{
    display:flex; align-items:center; gap:14px;
    padding:11px 2px; border-bottom:1px dashed #F7E4EC;
    font-size:14.5px;
  }
  #logList li:last-child{ border-bottom:0; }
  #logList li.empty{ display:block; text-align:center; color:#C3A7B6; font-size:13.5px; padding:22px 0; border:0; }
  .badge{
    flex:none; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center;
    background:#FFF1F6; border:1px solid #FBD3E0;
    color:#C58AA9; font-size:12.5px; font-weight:700;
  }
  .chips{ display:flex; gap:7px; flex:1; }
  .chips i{
    font-style:normal; font-size:13px; font-weight:700;
    padding:3px 10px; border-radius:9px;
  }
  .chips i.minus{ background:#FFF0F6; color:#B03A6E; border:1px solid #FBD3E0; }
  .chips i.plus{ background:#FFFAEF; color:#B5822F; border:1px solid #FCE6C3; }
  .final{ flex:none; font-size:14px; font-weight:700; color:#A63A6B; }

  /* ---------- 设置 ---------- */
  .switch{ display:flex; align-items:center; gap:13px; cursor:pointer; user-select:none; }
  .switch input{ display:none; }
  .track{
    flex:none; position:relative; width:48px; height:27px; border-radius:99px;
    background:#F2DCE6; transition:.22s;
  }
  .knob{
    position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(166,58,107,.32); transition:.22s;
  }
  .switch input:checked + .track{ background:linear-gradient(135deg,#E07BAE,#A63A6B); }
  .switch input:checked + .track .knob{ transform:translateX(21px); }
  .switch .text{ font-size:14.5px; color:#5B4150; }
  .note{ margin:12px 0 0; font-size:12.5px; color:#B39FA9; line-height:1.7; }

  .foot{ text-align:center; margin:22px 0 0; font-size:12px; color:#C3A7B6; letter-spacing:.5px; }

  /* ---------- 动画 ---------- */
  @keyframes pop{
    0%{ transform:scale(.72); opacity:.35; }
    60%{ transform:scale(1.14); }
    100%{ transform:scale(1); opacity:1; }
  }
  .pop{ animation:pop .42s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes flyIn{
    from{ transform:translateY(14px) rotate(-14deg) scale(.45); opacity:0; }
    to{ transform:none; opacity:1; }
  }
  .icon.new{ animation:flyIn .46s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes flip{
    0%{ transform:rotateX(-90deg) scale(.85); opacity:0; }
    100%{ transform:rotateX(0) scale(1); opacity:1; }
  }
  .slot.flip{ animation:flip .4s cubic-bezier(.34,1.4,.64,1) both; }
</style>
</head>
<body>

<div class="ripple" aria-hidden="true"></div>
<div class="ripple b" aria-hidden="true"></div>

<div class="app">

  <header class="hero">
    <h1>卷子抽奖</h1>
    <p>三张卷子起手 · 三次心跳 · 抽完归零重来♪</p>
    <p class="credit">Created by Cyrene &amp; momo</p>
  </header>

  <div class="grid">

    <section class="panel">
      <span class="tag">当前卷子</span>
      <div class="number"><span id="countEl">3</span><i>张</i></div>
      <div class="icons" id="iconsEl"></div>
      <p class="hint" id="emptyHint">卷子都飞走啦……别急，下一轮还会回来♪</p>
    </section>

    <section class="panel">
      <div class="row">
        <span class="round">第 <b id="roundEl">1</b> 轮</span>
        <span class="dots" id="dotsEl"></span>
      </div>
      <div class="slots" id="slotsEl"></div>
      <button class="btn" id="drawBtn">抽 取</button>
      <p class="odds">每次抽取 <b class="minus">40%</b> 减少 2 张 · <b class="plus">60%</b> 增加 1 张</p>
    </section>

  </div>

  <section class="panel stats">
    <div class="stat"><b id="statRounds">0</b><span>已完成轮数</span></div>
    <div class="stat"><b id="statAvg">—</b><span>平均每轮最终</span></div>
    <div class="stat"><b id="statBest">—</b><span>最高一轮最终</span></div>
  </section>

  <section class="panel history">
    <div class="panel-head">
      <span class="title">轮次记录</span>
      <button class="ghost" id="clearBtn">清空重来</button>
    </div>
    <ul id="logList"></ul>
  </section>

  <section class="panel">
    <label class="switch">
      <input type="checkbox" id="resetToggle" checked />
      <span class="track"><span class="knob"></span></span>
      <span class="text">每轮结束后，卷子数回到 3 张</span>
    </label>
    <p class="note">
      打开时：每一轮都是独立的三张起手，抽满 3 次就回到起点。<br />
      关掉时：卷子数保留，三次机会用完后从当前张数接着往下抽（最少到 0 张）。
    </p>
  </section>

  <p class="foot">单次名义期望 −0.2 张 · 一轮 −0.6 张　｜　触底后不再往下扣，实测一轮平均最终约 2.7 张</p>

</div>

<script>
(function(){
  'use strict';

  var CFG = {
    initial : 3,      // 初始卷子数
    perRound: 3,      // 每轮抽取次数
    pMinus  : 2/5,    // 40% 概率走减号
    minus   : 2,      // 减少 2 张
    plus    : 1,      // 增加 1 张
    maxIcons: 12      // 图标最多显示多少个
  };

  var $ = function(id){ return document.getElementById(id); };
  var countEl  = $('countEl'),  iconsEl   = $('iconsEl'),  emptyHint = $('emptyHint'),
      roundEl  = $('roundEl'),  dotsEl    = $('dotsEl'),   slotsEl   = $('slotsEl'),
      drawBtn  = $('drawBtn'),  statRounds= $('statRounds'), statAvg = $('statAvg'),
      statBest = $('statBest'), logList   = $('logList'),  clearBtn  = $('clearBtn'),
      resetToggle = $('resetToggle');

  var state = {
    count       : CFG.initial,
    draws       : [],          // 本轮已抽出的结果 [{delta, applied}]
    round       : 1,
    history     : [],          // [{round, draws, final}]
    resetEachRound: true,
    phase       : 'ready'      // ready | done
  };
  var prevCount = CFG.initial;

  /* ---------- 工具 ---------- */
  function pop(node){
    node.classList.remove('pop');
    void node.offsetWidth;
    node.classList.add('pop');
  }

  function scrollSvg(extra){
    return '<svg class="icon' + (extra ? ' ' + extra : '') + '" viewBox="0 0 40 48" aria-hidden="true">' +
             '<rect x="9" y="7" width="22" height="34" fill="#fff" stroke="#FBD3E0" stroke-width="1.2"/>' +
             '<line x1="14" y1="16" x2="26" y2="16" stroke="#F49BB8" stroke-width="1.8" stroke-linecap="round"/>' +
             '<line x1="14" y1="22" x2="26" y2="22" stroke="#FBD3E0" stroke-width="1.8" stroke-linecap="round"/>' +
             '<line x1="14" y1="28" x2="22" y2="28" stroke="#FBD3E0" stroke-width="1.8" stroke-linecap="round"/>' +
             '<rect x="3" y="3" width="8" height="42" rx="4" fill="#F49BB8"/>' +
             '<rect x="29" y="3" width="8" height="42" rx="4" fill="#F49BB8"/>' +
           '</svg>';
  }

  function sign(n){ return (n > 0 ? '+' : '−') + Math.abs(n); }

  /* ---------- 渲染 ---------- */
  function renderCounter(anim){
    countEl.textContent = state.count;
    if (anim) pop(countEl);

    var show = Math.min(state.count, CFG.maxIcons);
    var html = '';
    for (var i = 0; i < show; i++){
      html += scrollSvg(anim && i >= prevCount ? 'new' : '');
    }
    if (state.count > CFG.maxIcons){
      html += '<span class="more">+' + (state.count - CFG.maxIcons) + '</span>';
    }
    iconsEl.innerHTML = html;
    emptyHint.style.display = state.count === 0 ? 'block' : 'none';
    prevCount = state.count;
  }

  function renderTurn(anim){
    roundEl.textContent = state.round;

    var d = '';
    for (var i = 0; i < CFG.perRound; i++){
      d += '<span class="dot' + (state.draws.length > i ? ' on' : '') + '"></span>';
    }
    dotsEl.innerHTML = d;

    var s = '';
    var last = state.draws.length - 1;
    for (var j = 0; j < CFG.perRound; j++){
      var rec = state.draws[j];
      if (!rec){
        s += '<div class="slot">?</div>';
        continue;
      }
      var cls   = rec.delta < 0 ? 'minus' : 'plus';
      var capped = rec.applied !== rec.delta ? '<span class="cap">触底</span>' : '';
      var flip  = (anim && j === last) ? ' flip' : '';
      s += '<div class="slot ' + cls + flip + '"><em>' + sign(rec.delta) + '</em>' + capped + '</div>';
    }
    slotsEl.innerHTML = s;
  }

  function renderStats(){
    var h = state.history;
    statRounds.textContent = h.length;
    if (!h.length){
      statAvg.textContent  = '—';
      statBest.textContent = '—';
      return;
    }
    var sum = 0, best = h[0].final;
    for (var i = 0; i < h.length; i++){
      sum += h[i].final;
      if (h[i].final > best) best = h[i].final;
    }
    statAvg.textContent  = (sum / h.length).toFixed(1);
    statBest.textContent = best;
  }

  function renderLog(){
    if (!state.history.length){
      logList.innerHTML = '<li class="empty">还没有记录，点一下「抽取」试试♪</li>';
      return;
    }
    var html = '';
    for (var i = state.history.length - 1; i >= 0; i--){
      var r = state.history[i];
      var chips = '';
      for (var k = 0; k < r.draws.length; k++){
        chips += '<i class="' + (r.draws[k] < 0 ? 'minus' : 'plus') + '">' + sign(r.draws[k]) + '</i>';
      }
      html += '<li><span class="badge">' + r.round + '</span>' +
              '<span class="chips">' + chips + '</span>' +
              '<span class="final">' + r.final + ' 张</span></li>';
    }
    logList.innerHTML = html;
    logList.scrollTop = 0;
  }

  /* ---------- 流程 ---------- */
  function doDraw(){
    if (state.phase === 'done'){ startNextRound(); return; }
    if (state.draws.length >= CFG.perRound) return;

    var delta   = Math.random() < CFG.pMinus ? -CFG.minus : CFG.plus;
    var before  = state.count;
    var after   = Math.max(0, before + delta);   // 下限 0
    var applied = after - before;

    state.count = after;
    state.draws.push({ delta: delta, applied: applied });

    renderCounter(true);
    renderTurn(true);

    if (state.draws.length >= CFG.perRound) finishRound();
  }

  function finishRound(){
    state.phase = 'done';
    var raw = [];
    for (var i = 0; i < state.draws.length; i++) raw.push(state.draws[i].delta);
    state.history.push({ round: state.round, draws: raw, final: state.count });

    renderStats();
    renderLog();

    drawBtn.disabled = true;
    drawBtn.textContent = '本轮结束';
    setTimeout(function(){
      drawBtn.disabled = false;
      drawBtn.textContent = '开始新一轮';
    }, 850);
  }

  function startNextRound(){
    state.round += 1;
    state.draws = [];
    state.phase = 'ready';
    if (state.resetEachRound) state.count = CFG.initial;

    renderCounter(false);
    renderTurn(false);
    drawBtn.textContent = '抽 取';
    drawBtn.disabled = false;
  }

  function hardReset(){
    state.count   = CFG.initial;
    state.draws   = [];
    state.round   = 1;
    state.history = [];
    state.phase   = 'ready';
    prevCount     = CFG.initial;

    renderCounter(false);
    renderTurn(false);
    renderStats();
    renderLog();
    drawBtn.textContent = '抽 取';
    drawBtn.disabled = false;
  }

  /* ---------- 事件 ---------- */
  drawBtn.addEventListener('click', doDraw);
  clearBtn.addEventListener('click', hardReset);
  resetToggle.addEventListener('change', function(){
    state.resetEachRound = resetToggle.checked;
  });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      if (!drawBtn.disabled) doDraw();
    }
  });

  /* ---------- 初始化 ---------- */
  renderCounter(false);
  renderTurn(false);
  renderStats();
  renderLog();

})();
</script>
</body>
</html>
